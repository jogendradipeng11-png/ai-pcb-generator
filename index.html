<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI PCB Generator</title>
  <style>
    :root { color-scheme: dark; --ink: #e8edf2; --muted: #91a0aa; --panel: #162027; --line: #2c3d46; --accent: #7cf2c1; --danger: #ff9d9d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0%, #263d42, #0c1216 48%); color: var(--ink); font: 16px/1.5 Georgia, serif; }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 56px 24px 72px; }
    header { max-width: 720px; margin-bottom: 32px; }
    h1 { margin: 0; font: 700 clamp(2.2rem, 6vw, 4.8rem)/.95 Impact, Haettenschweiler, sans-serif; letter-spacing: 0; }
    .lede { color: var(--muted); font-size: 1.1rem; margin: 16px 0 0; }
    .composer, .results { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 24px; box-shadow: 0 20px 60px #0004; }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 112px; resize: vertical; background: #0d1519; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; padding: 14px; }
    textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .actions { align-items: center; display: flex; gap: 16px; margin-top: 16px; }
    button, .download { background: var(--accent); border: 0; border-radius: 5px; color: #092119; cursor: pointer; font: 700 1rem Georgia, serif; padding: 12px 18px; text-decoration: none; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { color: var(--muted); min-height: 1.5em; }
    #status.error { color: var(--danger); }
    .results { margin-top: 24px; }
    .summary { align-items: center; display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; margin-bottom: 22px; }
    .summary p { margin: 0; color: var(--muted); }
    .summary strong { color: var(--accent); }
    .previews { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    figure { margin: 0; }
    figcaption { font-weight: 700; margin-bottom: 8px; }
    figure img { background: #091014; border: 1px solid var(--line); border-radius: 5px; display: block; min-height: 180px; object-fit: contain; width: 100%; }
    @media (max-width: 680px) { main { padding: 36px 16px 48px; } .composer, .results { padding: 18px; } .previews { grid-template-columns: 1fr; } .actions { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI PCB Generator</h1>
      <p class="lede">Describe the circuit. Get a connectivity-checked schematic, board preview, and bill of materials.</p>
    </header>
    <form class="composer" id="generator-form">
      <label for="prompt">Circuit description</label>
      <textarea id="prompt" maxlength="2000" placeholder="USB-C 3.3V regulator with CC pulldowns and an I2C header" required></textarea>
      <div class="actions">
        <button id="generate" type="submit">Generate PCB</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
    <section class="results" id="results" hidden aria-labelledby="results-title">
      <div class="summary">
        <div><h2 id="results-title">Generated design</h2><p id="test-summary"></p></div>
        <a class="download" id="bom-download" download="bom.csv">Download BOM</a>
      </div>
      <div class="previews">
        <figure><figcaption>Schematic</figcaption><img id="schematic" alt="Generated schematic"></figure>
        <figure><figcaption>PCB layout</figcaption><img id="pcb" alt="Generated PCB layout"></figure>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById('generator-form');
    const promptField = document.getElementById('prompt');
    const generateButton = document.getElementById('generate');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = promptField.value.trim();
      if (!prompt) return promptField.focus();
      generateButton.disabled = true;
      status.className = '';
      status.textContent = 'Generating and checking the circuit...';
      results.hidden = true;
      try {
        const response = await fetch('/generate', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({prompt}) });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) throw new Error(data.error || `Generation failed (HTTP ${response.status}).`);
        document.getElementById('schematic').src = `data:image/png;base64,${data.schematic_png}`;
        document.getElementById('pcb').src = `data:image/png;base64,${data.pcb_png}`;
        document.getElementById('test-summary').innerHTML = `<strong>${data.circuit_test.status}</strong> connectivity test: ${data.circuit_test.components} components, ${data.circuit_test.traces} connections`;
        document.getElementById('bom-download').href = `data:text/csv;charset=utf-8,${encodeURIComponent(data.bom_csv)}`;
        results.hidden = false;
        status.textContent = 'Design ready.';
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message;
      } finally {
        generateButton.disabled = false;
      }
    });
  </script>
</body>
</html>
