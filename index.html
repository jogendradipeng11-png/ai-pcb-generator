<!DOCTYPE html>
<html>
<head><title>AI PCB Generator</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;padding:20px}
textarea{width:100%;height:100px;background:#1a1a1a;color:#fff;border:1px solid #333;padding:10px}
button{background:#00ff88;color:#000;padding:12px 24px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.result{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
img{width:100%;background:#111;border-radius:8px}
</style>
</head>
<body>
  <h1>AI PCB Generator</h1>
  <textarea id="prompt" placeholder="e.g. USB-C 3.3V regulator with CC pulldowns and I2C header"></textarea>
  <button onclick="generate()">Generate PCB</button>
  <div id="loading" style="display:none">Generating...</div>
  <div id="result" class="result"></div>

<script>
async function generate() {
  const promptField = document.getElementById('prompt');
  const loading = document.getElementById('loading');
  const result = document.getElementById('result');
  const prompt = promptField.value.trim();

  if (!prompt) {
    promptField.focus();
    result.textContent = 'Enter a circuit description first.';
    return;
  }

  loading.style.display = 'block';
  result.textContent = '';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || 'Generation failed.');
    }

    result.innerHTML = `
      <p><strong>Circuit test:</strong> ${data.circuit_test.status} (${data.circuit_test.components} components, ${data.circuit_test.traces} connections)</p>
      <div><h3>Schematic</h3><img alt="Generated schematic" src="data:image/png;base64,${data.schematic_png}"/></div>
      <div><h3>PCB</h3><img alt="Generated PCB layout" src="data:image/png;base64,${data.pcb_png}"/></div>
      <a href="${csvUrl(data.bom_csv)}" download="bom.csv">Download BOM</a>
    `;
  } catch (error) {
    result.textContent = error.message;
  } finally {
    loading.style.display = 'none';
  }
}

function csvUrl(csv) {
  return `data:text/csv;charset=utf-8,${encodeURIComponent(csv)}`;
}
</script>
</body>
</html>
