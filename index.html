<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI PCB Generator - NVIDIA</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="container">
  <h1>⚡ AI PCB Generator</h1>
  <p>Powered by NVIDIA Llama 3.1. Describe any circuit.</p>

  <div class="input-box">
    <input type="text" id="prompt" placeholder="Ex: 8S 100A LiFePO4 BMS with CD74HC4067 and INA219">
    <button id="generateBtn">Generate PCB</button>
  </div>

  <div id="loader" class="hidden">Generating with NVIDIA... Please wait 10s</div>

  <div id="results" class="hidden">
    <div class="tabs">
      <button class="tab-btn active" data-tab="schematic">📐 Schematic</button>
      <button class="tab-btn" data-tab="3d">📦 3D PCB Preview</button>
      <button class="tab-btn" data-tab="bom">📋 Bill of Materials</button>
    </div>

    <div id="schematic" class="tab-content active">
      <pre id="schCode"></pre>
      <button onclick="downloadFile('design.kicad_sch', document.getElementById('schCode').innerText)">📄 Download.kicad_sch</button>
    </div>

    <div id="3d" class="tab-content">
      <div id="pcb3d"></div>
    </div>

    <div id="bom" class="tab-content">
      <table id="bomTable"></table>
      <button onclick="downloadCSV()">📋 Download BOM.csv</button>
    </div>
  </div>
</div>

<script type="module" src="/static/script.js"></script>
</body>
</html>
